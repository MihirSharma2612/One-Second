name: One Second CI

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_STORE_MODE: demo
      CATALOG_SOURCE: database
      DATABASE_URL: mysql://root:ci_demo_password@127.0.0.1:3306/one_second_test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_demo_password
          MYSQL_DATABASE: one_second_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate database schema and generate client
        run: npm run db:validate && npm run db:generate
      - name: Apply migrations to isolated test database
        run: npm run db:migrate
      - name: Verify migration and seed retry safety
        run: npm run db:migrate && npm run db:seed && npm run db:seed
      - name: MySQL integration tests
        run: npm run test:database
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Typecheck (including generated route types)
        run: npm run typecheck
      - name: Production HTTP smoke tests
        run: npm run test:smoke
